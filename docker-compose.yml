version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
        - VITE_APPWRITE_ENDPOINT=${VITE_APPWRITE_ENDPOINT}
        - VITE_APPWRITE_PROJECT_ID=${VITE_APPWRITE_PROJECT_ID}
        - VITE_AI_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
